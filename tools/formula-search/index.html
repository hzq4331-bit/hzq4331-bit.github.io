const CATS = ["全部", "机械公式", "电气公式", "标准件规格", "单位换算"];
let activeCat = "全部";

/* ============ 逻辑区 ============ */
function renderCats() {
  document.getElementById("cats").innerHTML = CATS.map(c =>
    `<button class="${c === activeCat ? "active" : ""}" onclick="setCat('${c}')">${UI[LANG].cats[c]}</button>`
  ).join("");
}
function setCat(c) { activeCat = c; renderCats(); render(); }
function render() {
  const ui = UI[LANG];
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = DATA.filter(d => {
    const catOk = activeCat === "全部" || d.cat === activeCat;
    if (!catOk) return false;
    if (!q) return true;
    const hay = (d.title + " " + (d.title_en || "") + " " + d.kw + " " +
      d.body.replace(/<[^>]+>/g, "") + " " + (d.body_en || "").replace(/<[^>]+>/g, "")).toLowerCase();
    return hay.includes(q);
  });
  document.getElementById("count").textContent = ui.count(list.length);
  document.getElementById("list").innerHTML = list.length ? list.map(d => `
    <div class="card">
      <h2>${LANG === "zh" ? d.title : (d.title_en || d.title)}<span class="tag">${ui.cats[d.cat]}</span></h2>
      <div class="kw">${ui.kwLabel}${d.kw}</div>
      ${LANG === "zh" ? d.body : (d.body_en || d.body)}
    </div>`).join("")
    : `<div class="empty">${ui.empty(document.getElementById("q").value)}</div>`;
}
function calcPTN() {
  const P = parseFloat(document.getElementById("cP").value);
  const T = parseFloat(document.getElementById("cT").value);
  const N = parseFloat(document.getElementById("cN").value);
  const out = document.getElementById("cOut");
  const filled = [!isNaN(P), !isNaN(T), !isNaN(N)].filter(Boolean).length;
  if (filled !== 2) { out.textContent = UI[LANG].ptnErr; return; }
  if (isNaN(P)) out.textContent = `P = ${(T * N / 9550).toFixed(3)} kW`;
  else if (isNaN(T)) out.textContent = `T = ${(9550 * P / N).toFixed(2)} N·m`;
  else out.textContent = `n = ${(9550 * P / T).toFixed(1)} r/min`;
}
function calcI3() {
  const P = parseFloat(document.getElementById("ci3P").value);
  const U = parseFloat(document.getElementById("ci3U").value) || 380;
  const c = parseFloat(document.getElementById("ci3C").value) || 0.85;
  const e = parseFloat(document.getElementById("ci3E").value) || 0.9;
  const out = document.getElementById("ci3Out");
  if (isNaN(P) || P <= 0) { out.textContent = UI[LANG].i3Err; return; }
  out.textContent = `I = ${(P * 1000 / (1.7320508 * U * c * e)).toFixed(2)} A`;
}
function calcLS() {
  const D = parseFloat(document.getElementById("lsD").value);
  const N = parseFloat(document.getElementById("lsN").value);
  const out = document.getElementById("lsOut");
  if (isNaN(D) || isNaN(N) || D <= 0 || N <= 0) { out.textContent = UI[LANG].lsErr; return; }
  out.textContent = `v = ${(Math.PI * D * N / 60000).toFixed(2)} m/s`;
}
function setLang(lang) {
  if (!UI[lang]) lang = "zh";
  LANG = lang;
  const ui = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = ui.docTitle;
  document.getElementById("hdr-title").textContent = ui.hdrTitle;
  document.getElementById("hdr-sub").textContent = ui.hdrSub;
  document.getElementById("q").setAttribute("placeholder", ui.placeholder);
  document.getElementById("ftr").textContent = ui.footer;
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
  try { localStorage.setItem("md-lang", lang); } catch (e) {}
  renderCats(); render();
}
document.getElementById("q").addEventListener("input", render);
(function () {
  let lang = null;
  try { lang = localStorage.getItem("md-lang"); } catch (e) {}
  if (!lang) {
    const nav = (navigator.language || "zh").toLowerCase();
    lang = nav.indexOf("zh") === 0 ? "zh" : "en";
  }
  setLang(lang);
})();
</script>
